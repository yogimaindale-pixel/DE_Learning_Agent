[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "DE_Learning_Agent"
version = "1.0.0"
description = "A deterministic, week-wise Python and SQL data engineering learning agent using synthetic data"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0.0",
    "pyyaml>=6.0",
    "pytest>=8.0.0",
    "pyarrow>=14.0.0",
    "pandera>=0.18.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
